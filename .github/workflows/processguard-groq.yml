name: PROCESSGUARD Groq Benchmark

on:
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_MODEL: openai/gpt-oss-20b
      AUTO_RUN: "false"

    steps:
      - name: Checkout experiment branch
        uses: actions/checkout@v4
        with:
          ref: processguard-20261004

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r processguard_runner/requirements.txt

      - name: Verify secret is present
        run: |
          if [ -z "$GROQ_API_KEY" ]; then
            echo "GROQ_API_KEY secret is missing"
            exit 1
          fi

      - name: Run 960-call paired PROCESSGUARD benchmark
        run: cd processguard_runner && python batch_run.py

      - name: Upload empirical results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: processguard-empirical-results
          path: |
            processguard_runner/results.csv
            processguard_runner/metrics.json
          if-no-files-found: warn
